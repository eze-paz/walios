# walios build farm: Alpine aports -> wasm32-wali, built in parallel on GitHub runners,
# published as a release that the walios package CDN serves (walios/cdn in sandpie).
# Up to 28 waves follow the dependency graph (Alpine's goes 25 deep); libraries built in a wave reach the next ones as
# overlay artifacts. See farm/ci/.
name: farm
on:
  # A commit that changes farm/ci/request.json runs the farm with the inputs in it (same
  # keys as below), so a run can be asked for without Actions API rights.
  push:
    branches: [main]
    paths: ['farm/ci/request.json']
  workflow_dispatch:
    inputs:
      pkgs:   { description: 'Packages (space separated); empty = sample/all', required: false, default: '' }
      sample: { description: 'Random sample size from farm/ci/catalog.txt (when pkgs is empty)', required: false, default: '50' }
      all:    { description: 'Build the whole catalog (ignores sample)', type: boolean, default: false }
      max:    { description: 'Cap on packages incl. dependency closure', required: false, default: '400' }
      chunk:  { description: 'Packages per job', required: false, default: '4' }
      publish: { description: 'Publish a release', type: boolean, default: true }

permissions:
  contents: write

# A newer request replaces a run still in progress (the token that triggers runs cannot
# cancel them through the API).
concurrency:
  # per branch: a run asked for on another branch (a parallel session's) must not cancel this one
  group: farm-${{ github.ref }}
  cancel-in-progress: true

env:
  TC: ${{ github.workspace }}/../wali-tc
  TC_KEY: wali-tc-llvm22.1.3-pkgs-2026-10-31-x1-v31-ilp32

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      w0: ${{ steps.p.outputs.w0 }}
      w1: ${{ steps.p.outputs.w1 }}
      w2: ${{ steps.p.outputs.w2 }}
      w3: ${{ steps.p.outputs.w3 }}
      w4: ${{ steps.p.outputs.w4 }}
      w5: ${{ steps.p.outputs.w5 }}
      w6: ${{ steps.p.outputs.w6 }}
      w7: ${{ steps.p.outputs.w7 }}
      w8: ${{ steps.p.outputs.w8 }}
      w9: ${{ steps.p.outputs.w9 }}
      w10: ${{ steps.p.outputs.w10 }}
      w11: ${{ steps.p.outputs.w11 }}
      w12: ${{ steps.p.outputs.w12 }}
      w13: ${{ steps.p.outputs.w13 }}
      w14: ${{ steps.p.outputs.w14 }}
      w15: ${{ steps.p.outputs.w15 }}
      w16: ${{ steps.p.outputs.w16 }}
      w17: ${{ steps.p.outputs.w17 }}
      w18: ${{ steps.p.outputs.w18 }}
      w19: ${{ steps.p.outputs.w19 }}
      w20: ${{ steps.p.outputs.w20 }}
      w21: ${{ steps.p.outputs.w21 }}
      w22: ${{ steps.p.outputs.w22 }}
      w23: ${{ steps.p.outputs.w23 }}
      w24: ${{ steps.p.outputs.w24 }}
      w25: ${{ steps.p.outputs.w25 }}
      w26: ${{ steps.p.outputs.w26 }}
      w27: ${{ steps.p.outputs.w27 }}
      count: ${{ steps.p.outputs.count }}
      publish: ${{ steps.in.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Alpine aports (GitHub mirror)
        run: git clone -q --depth 1 https://github.com/alpinelinux/aports.git ../aports && git -C ../aports log -1 --format='aports %h %cs'
      - name: Inputs (dispatch form, or farm/ci/request.json on push)
        id: in
        env:
          EV: ${{ github.event_name }}
          IN: ${{ toJSON(inputs) }}
        run: |
          node -e '
            const ev = process.env.EV, i = ev === "push" ? require("./farm/ci/request.json") : JSON.parse(process.env.IN || "{}");
            const v = (k, d) => (i[k] === undefined || i[k] === "" ? d : String(i[k]));
            const out = { PKGS: v("pkgs", ""), SAMPLE: v("sample", "50"), ALL: (i.all === true || i.all === "true") ? "1" : "",
                          MAX: v("max", "400"), CHUNK: v("chunk", "4"), PUBLISH: (i.publish === false || i.publish === "false") ? "" : "1" };
            require("fs").appendFileSync(process.env.GITHUB_ENV, Object.entries(out).map(([k, x]) => k + "=" + x).join("\n") + "\n");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "publish=" + out.PUBLISH + "\n");
            console.log(out);'
      - id: p
        env:
          WAVES: '28'
          APORTS_DIR: ${{ github.workspace }}/../aports
          APORTS_LIST: ${{ github.workspace }}/../aports-list.txt
          DEPS_OUT: ${{ github.workspace }}/../aports/deps.json
          ALIASES_OUT: ${{ github.workspace }}/aliases.json
        run: node farm/ci/plan.js
      - name: Recipes the build jobs need
        run: tar czf aports.tar.gz -C ../aports deps.json $(cat ../aports-list.txt)
      - uses: actions/upload-artifact@v4
        with: { name: aports, path: 'aports.tar.gz', retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: aliases, path: 'aliases.json', retention-days: 7 }
      - name: Toolchain (cached for every build job)
        uses: actions/cache@v4
        id: tc
        with: { path: '${{ env.TC }}', key: '${{ env.TC_KEY }}' }
      - if: steps.tc.outputs.cache-hit != 'true'
        run: sudo apt-get install -y -qq libbsd-dev >/dev/null && bash farm/ci/toolchain.sh "$TC"

  wave0:
    needs: plan
    if: needs.plan.outputs.w0 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 0, chunks: '${{ needs.plan.outputs.w0 }}' }
  wave1:
    needs: [plan, wave0]
    if: always() && needs.plan.outputs.w1 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 1, chunks: '${{ needs.plan.outputs.w1 }}' }
  wave2:
    needs: [plan, wave1]
    if: always() && needs.plan.outputs.w2 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 2, chunks: '${{ needs.plan.outputs.w2 }}' }
  wave3:
    needs: [plan, wave2]
    if: always() && needs.plan.outputs.w3 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 3, chunks: '${{ needs.plan.outputs.w3 }}' }
  wave4:
    needs: [plan, wave3]
    if: always() && needs.plan.outputs.w4 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 4, chunks: '${{ needs.plan.outputs.w4 }}' }
  wave5:
    needs: [plan, wave4]
    if: always() && needs.plan.outputs.w5 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 5, chunks: '${{ needs.plan.outputs.w5 }}' }
  wave6:
    needs: [plan, wave5]
    if: always() && needs.plan.outputs.w6 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 6, chunks: '${{ needs.plan.outputs.w6 }}' }
  wave7:
    needs: [plan, wave6]
    if: always() && needs.plan.outputs.w7 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 7, chunks: '${{ needs.plan.outputs.w7 }}' }
  wave8:
    needs: [plan, wave7]
    if: always() && needs.plan.outputs.w8 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 8, chunks: '${{ needs.plan.outputs.w8 }}' }
  wave9:
    needs: [plan, wave8]
    if: always() && needs.plan.outputs.w9 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 9, chunks: '${{ needs.plan.outputs.w9 }}' }
  wave10:
    needs: [plan, wave9]
    if: always() && needs.plan.outputs.w10 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 10, chunks: '${{ needs.plan.outputs.w10 }}' }
  wave11:
    needs: [plan, wave10]
    if: always() && needs.plan.outputs.w11 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 11, chunks: '${{ needs.plan.outputs.w11 }}' }
  wave12:
    needs: [plan, wave11]
    if: always() && needs.plan.outputs.w12 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 12, chunks: '${{ needs.plan.outputs.w12 }}' }
  wave13:
    needs: [plan, wave12]
    if: always() && needs.plan.outputs.w13 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 13, chunks: '${{ needs.plan.outputs.w13 }}' }
  wave14:
    needs: [plan, wave13]
    if: always() && needs.plan.outputs.w14 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 14, chunks: '${{ needs.plan.outputs.w14 }}' }
  wave15:
    needs: [plan, wave14]
    if: always() && needs.plan.outputs.w15 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 15, chunks: '${{ needs.plan.outputs.w15 }}' }
  wave16:
    needs: [plan, wave15]
    if: always() && needs.plan.outputs.w16 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 16, chunks: '${{ needs.plan.outputs.w16 }}' }
  wave17:
    needs: [plan, wave16]
    if: always() && needs.plan.outputs.w17 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 17, chunks: '${{ needs.plan.outputs.w17 }}' }
  wave18:
    needs: [plan, wave17]
    if: always() && needs.plan.outputs.w18 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 18, chunks: '${{ needs.plan.outputs.w18 }}' }
  wave19:
    needs: [plan, wave18]
    if: always() && needs.plan.outputs.w19 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 19, chunks: '${{ needs.plan.outputs.w19 }}' }
  wave20:
    needs: [plan, wave19]
    if: always() && needs.plan.outputs.w20 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 20, chunks: '${{ needs.plan.outputs.w20 }}' }
  wave21:
    needs: [plan, wave20]
    if: always() && needs.plan.outputs.w21 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 21, chunks: '${{ needs.plan.outputs.w21 }}' }
  wave22:
    needs: [plan, wave21]
    if: always() && needs.plan.outputs.w22 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 22, chunks: '${{ needs.plan.outputs.w22 }}' }
  wave23:
    needs: [plan, wave22]
    if: always() && needs.plan.outputs.w23 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 23, chunks: '${{ needs.plan.outputs.w23 }}' }
  wave24:
    needs: [plan, wave23]
    if: always() && needs.plan.outputs.w24 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 24, chunks: '${{ needs.plan.outputs.w24 }}' }
  wave25:
    needs: [plan, wave24]
    if: always() && needs.plan.outputs.w25 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 25, chunks: '${{ needs.plan.outputs.w25 }}' }
  wave26:
    needs: [plan, wave25]
    if: always() && needs.plan.outputs.w26 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 26, chunks: '${{ needs.plan.outputs.w26 }}' }
  wave27:
    needs: [plan, wave26]
    if: always() && needs.plan.outputs.w27 != '[]'
    uses: ./.github/workflows/farm-wave.yml
    with: { wave: 27, chunks: '${{ needs.plan.outputs.w27 }}' }

  publish:
    needs: [plan, wave0, wave1, wave2, wave3, wave4, wave5, wave6, wave7, wave8, wave9, wave10, wave11, wave12, wave13, wave14, wave15, wave16, wave17, wave18, wave19, wave20, wave21, wave22, wave23, wave24, wave25, wave26, wave27]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'res-*', path: res, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: aliases, path: . }
      - name: Index + summary
        run: |
          TAG="farm-$(date -u +%Y-%m-%d)-${{ github.run_number }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          node farm/ci/make-index.js res "$TAG" > index.json 2> summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          tar czf logs.tar.gz -C res $(cd res && ls *.log)
      - uses: actions/upload-artifact@v4
        with: { name: farm-index, path: 'index.json' }
      - name: Release
        if: needs.plan.outputs.publish == '1'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # ~1000 files per release: runnable packages past the index's SPILL go to $TAG-b
          # (make-index wrote them to res/spill.txt), and all overlays travel as one tarball.
          # (uploads retry: GitHub answers an occasional asset upload with a 404; --clobber resumes)
          up() { r=$1; shift; for t in 1 2 3 4 5; do gh release upload "$r" --clobber "$@" && return 0; sleep 30; done; return 1; }
          gh release create "$TAG" --title "walios farm $TAG" --notes-file summary.md --prerelease
          mkdir -p spill; while read -r f; do [ -n "$f" ] && mv "res/$f" spill/; done < res/spill.txt
          # runnable packages (.wasm) and pure-Perl/Lua modules (.mod.tar.gz)
          pk=$(ls res/*.wasm res/*.mod.tar.gz 2>/dev/null || true)
          [ -n "$pk" ] && up "$TAG" $pk
          sp=$(ls spill/* 2>/dev/null || true)
          if [ -n "$sp" ]; then
            gh release create "$TAG-b" --title "walios farm $TAG (b)" --notes "Packages of $TAG past the first release's file limit; see $TAG/index.json." --prerelease
            up "$TAG-b" $sp
          fi
          ls res/*.overlay.tar.gz >/dev/null 2>&1 && tar czf overlays.tar.gz -C res $(cd res && ls *.overlay.tar.gz)
          up "$TAG" index.json logs.tar.gz $( [ -f overlays.tar.gz ] && echo overlays.tar.gz )
