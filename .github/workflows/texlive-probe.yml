name: pdftex-walios-probe
on:
  push:
    branches: [experiment/texlive-gha]
    paths:
      - .github/workflows/texlive-probe.yml
      - farm/ci/build-pdftex.sh
  workflow_dispatch:

# Superseded attempts on this experiment branch should not spend more runner time.

permissions:
  contents: read

env:
  TC: ${{ github.workspace }}/../wali-tc
  TC_KEY: wali-tc-llvm22.1.3-pkgs-2026-10-31-x1-v56-ilp32

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: tc
        with:
          path: ${{ env.TC }}
          key: ${{ env.TC_KEY }}
      - name: Install WALI toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libbsd-dev
          bash farm/ci/toolchain.sh "$TC"
      - name: Patch cached libc environment reader
        run: bash farm/ci/libc-envpatch.sh "$TC"
      - name: Native tools for TeX WEB sources
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-binaries gcc-multilib
          command -v tangle ctangle otangle tie
      - name: Build and run pdfTeX
        run: bash farm/ci/build-pdftex.sh
      - name: Preserve binary, logs and smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdftex-walios-probe
          path: |
            artifacts/
            'texlive-src/build/**/config.log'
          if-no-files-found: ignore
          retention-days: 14