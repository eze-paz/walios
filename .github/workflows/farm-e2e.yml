# farm e2e: every package a farm release built, run in the real walios kernel (headless Chromium,
# both engines) -- see farm/e2e/run.mjs. Results: e2e.json on the farm release and the job summary
# ("works X/1660").
name: farm-e2e
on:
  # A commit that changes farm/e2e/request.json runs this with the inputs in it:
  #   { "tag": "farm-...", "busybox": "runtimes-...", "python": "runtimes-...", "perl_lua": "runtimes-...", "shards": 8 }
  push:
    branches: [main]
    paths: ['farm/e2e/request.json']

permissions:
  contents: write

concurrency:
  group: farm-e2e
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      req: ${{ steps.in.outputs.req }}
      shards: ${{ steps.in.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: farm/e2e }
      - id: in
        run: |
          node -e '
            const r = require("./farm/e2e/request.json"), n = r.shards || 8;
            for (const k of ["tag", "busybox", "python", "perl_lua"]) if (!r[k]) throw new Error("request.json: " + k);
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `req=${JSON.stringify(r)}\nshards=${JSON.stringify([...Array(n).keys()])}\n`);
            console.log(r);'

  shard:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQ: ${{ needs.plan.outputs.req }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Playwright
        run: |
          cd farm/e2e && npm init -y >/dev/null && npm i --no-save playwright@1.63.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Inputs
        run: |
          T() { node -e "console.log(JSON.parse(process.env.REQ)['$1'])"; }
          # public download URLs, not the Releases API (a dozen shards hit its rate limit);
          # the farm files themselves are fetched by run.mjs --fetch, only the shard's own
          get() { tag=$1 dir=$2; shift 2; for f in "$@"; do
            curl -fsSL --retry 5 --retry-delay 5 -o "$dir/$f" "https://github.com/${{ github.repository }}/releases/download/$tag/$f" || return 1; done; }
          mkdir -p dl/farm dl/rt dl/kernel
          get "$(T tag)" dl/farm index.json
          get "$(T busybox)" dl/rt busybox.wasm busybox.links
          get "$(T python)" dl/rt python_cxx.wasm python-ext.tar.gz _sysconfigdata__linux_x86_64-linux-gnu.py
          get "$(T perl_lua)" dl/rt perl.wasm perllib.tar.gz lua.wasm
          cp browser/rootfs.tar.gz browser/pylib.tar.gz dl/rt/
          cp farm/e2e/kernel/*.js dl/kernel/
          ls -la dl/rt dl/kernel; ls dl/farm | wc -l
      - name: Run
        run: |
          N=$(node -e "console.log(JSON.parse(process.env.REQ).shards || 8)")
          node farm/e2e/run.mjs --farm dl/farm --rt dl/rt --kernel dl/kernel --catalog farm/ci/catalog.txt \
            --shard ${{ matrix.shard }}/$N --out e2e-${{ matrix.shard }}.json \
            --fetch "https://github.com/${{ github.repository }}/releases/download/$(node -e "console.log(JSON.parse(process.env.REQ).tag)")"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'e2e-${{ matrix.shard }}', path: 'e2e-${{ matrix.shard }}.json', if-no-files-found: ignore, retention-days: 14 }

  merge:
    needs: [plan, shard]
    if: always()
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REQ: ${{ needs.plan.outputs.req }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: farm }
      - uses: actions/download-artifact@v4
        with: { pattern: 'e2e-*', path: res, merge-multiple: true }
      - name: Merge + publish
        run: |
          TAG=$(node -e "console.log(JSON.parse(process.env.REQ).tag)")
          curl -fsSL --retry 5 --retry-delay 5 -o index.json "https://github.com/${{ github.repository }}/releases/download/$TAG/index.json"
          node farm/e2e/merge.mjs res index.json farm/ci/catalog.txt e2e.json | tee summary.txt
          { echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # (the upload is one API call; when the hour's API quota is spent, retry for up to 10 min)
          for t in $(seq 1 20); do gh release upload "$TAG" --clobber e2e.json && break; sleep 30; done
