name: stop-superseded-texlive-probes
on:
  push:
    branches: [experiment/texlive-gha]
    paths: [.github/workflows/texlive-cleanup.yml]
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel broad farm and queue-blocked probe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Both IDs are workflow runs created earlier by this experiment branch.
        run: |
          gh run cancel 45452833814
          gh run cancel 45454216688