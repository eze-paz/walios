# Build clang + lld as WebAssembly (wasm32-wasi) so the WALI wasm-OS can run a
# real C/C++ cross-compiler in the browser. Produces clang.wasm + lld.wasm.
#
# This is the artifact that couldn't be built on the 7GB dev box (needs native
# v22 tblgen tools + a big-RAM link). A CI runner clears both walls. Self-
# contained: downloads its own wasi-sdk + LLVM source, so it needs no repo state.
#
# Runner sizing: the final static link of clang.wasm is the memory spike.
# The free ubuntu-latest is 16GB RAM (only ~2x the dev box) — NOT enough on its
# own. What makes it work is what the dev box lacked: root. So this workflow adds
# a 32GB swapfile on the big scratch disk (/mnt, ~70GB) and links single-threaded;
# 16GB RAM + 32GB swap completes the link (slowly). If it still fails, bump
# `runs-on` to a larger/self-hosted runner — the only change needed.

name: build-wasm-clang

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: "LLVM version (must match wasi-sdk's major)"
        default: "22.1.3"
      wasi_sdk_asset:
        description: "wasi-sdk release asset (OS-tagged tarball)"
        default: "wasi-sdk-33.0-x86_64-linux.tar.gz"
      wasi_sdk_tag:
        description: "wasi-sdk release tag"
        default: "wasi-sdk-33"

concurrency:
  group: build-wasm-clang
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest   # bump to a 32GB runner if the link OOMs
    timeout-minutes: 360
    env:
      LLVM_VER: ${{ github.event.inputs.llvm_version || '22.1.3' }}
      WASI_ASSET: ${{ github.event.inputs.wasi_sdk_asset || 'wasi-sdk-33.0-x86_64-linux.tar.gz' }}
      WASI_TAG: ${{ github.event.inputs.wasi_sdk_tag || 'wasi-sdk-33' }}
    # Build on the big scratch disk (/mnt, ~70GB) rather than / (~14GB).
    defaults:
      run:
        working-directory: /mnt/build
    steps:
      - name: Prepare disk + swap (the free 16GB runner needs swap for the link)
        working-directory: /
        run: |
          # LLVM checkout + two build trees need ~40GB; strip preinstalled bloat.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -a -f || true
          # This is the escape hatch the 7GB dev box lacked (no sudo there):
          # 32GB swapfile on the big scratch disk absorbs the clang.wasm link spike.
          sudo swapoff -a || true
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          sudo mkdir -p /mnt/build && sudo chown "$USER" /mnt/build
          echo "=== memory + disk after setup:"; free -h; df -h / /mnt

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 curl xz-utils

      - name: Cache wasi-sdk
        id: cache-wasi
        uses: actions/cache@v4
        with:
          path: /mnt/build/wasi-sdk
          key: ${{ env.WASI_TAG }}-${{ env.WASI_ASSET }}

      - name: Download wasi-sdk (cross libc++/libc + native clang)
        if: steps.cache-wasi.outputs.cache-hit != 'true'
        run: |
          curl -L -o wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/${WASI_TAG}/${WASI_ASSET}"
          mkdir wasi-sdk && tar xf wasi-sdk.tar.gz -C wasi-sdk --strip-components=1
          rm wasi-sdk.tar.gz

      - name: Cache LLVM source
        id: cache-src
        uses: actions/cache@v4
        with:
          path: /mnt/build/llvm-src
          key: llvm-src-${{ env.LLVM_VER }}

      - name: Download LLVM source
        if: steps.cache-src.outputs.cache-hit != 'true'
        run: |
          curl -L -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VER}/llvm-project-${LLVM_VER}.src.tar.xz"
          mkdir llvm-src && tar xf llvm.tar.xz -C llvm-src --strip-components=1
          rm llvm.tar.xz

      # Stage 1: native tblgen tools (clang-tblgen is build-only; not in releases).
      - name: Configure + build native tblgen
        run: |
          cmake -S llvm-src/llvm -B build-native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="WebAssembly" \
            -DLLVM_ENABLE_ASSERTIONS=OFF
          ninja -C build-native llvm-tblgen clang-tblgen llvm-config

      # Stage 2: cross-compile clang + lld to wasm32-wasi with wasi-sdk.
      - name: Configure cross build (-> wasm32-wasi)
        run: |
          # shim: LLVM's bit.h falls to BSD-style <machine/endian.h> on wasi
          # (clang defines __wasi__, not __linux__); redirect it to <endian.h>.
          mkdir -p /mnt/build/shims/machine
          echo '#include <endian.h>' > /mnt/build/shims/machine/endian.h
          WASI="$PWD/wasi-sdk"
          SYSROOT="$WASI/share/wasi-sysroot"
          CFLAGS_W="--target=wasm32-wasi --sysroot=$SYSROOT -I/mnt/build/shims -fwasm-exceptions -D_WASI_EMULATED_SIGNAL -D_WASI_EMULATED_PROCESS_CLOCKS -D_WASI_EMULATED_GETPID -D_WASI_EMULATED_MMAN"
          cmake -S llvm-src/llvm -B build-wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$WASI/bin/clang" \
            -DCMAKE_CXX_COMPILER="$WASI/bin/clang++" \
            -DCMAKE_C_FLAGS="$CFLAGS_W" \
            -DCMAKE_CXX_FLAGS="$CFLAGS_W" \
            -DCMAKE_EXE_LINKER_FLAGS="-lwasi-emulated-signal -lwasi-emulated-process-clocks -lwasi-emulated-getpid -lwasi-emulated-mman -Wl,--max-memory=4294967296 -Wl,-z,stack-size=8388608" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_CROSSCOMPILING=ON \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="WebAssembly" \
            -DLLVM_TABLEGEN="$PWD/build-native/bin/llvm-tblgen" \
            -DCLANG_TABLEGEN="$PWD/build-native/bin/clang-tblgen" \
            -DLLVM_CONFIG_PATH="$PWD/build-native/bin/llvm-config" \
            -DLLVM_ENABLE_THREADS=OFF -DLLVM_ENABLE_PIC=OFF -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON -DLLVM_BUILD_LLVM_DYLIB=OFF -DLLVM_BUILD_LLVM_C_DYLIB=OFF -DCLANG_LINK_CLANG_DYLIB=OFF \
            -DLLVM_ENABLE_UNWIND_TABLES=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_UTILS=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF -DCLANG_ENABLE_ARCMT=OFF

      - name: Compile (parallel) then link (single-threaded to survive RAM)
        run: |
          # objects compile fine in parallel; the clang.wasm link is the spike.
          ninja -C build-wasm -j$(nproc) clang lld || true
          ninja -C build-wasm -j1 clang lld

      - name: Collect artifacts
        run: |
          mkdir -p out
          find build-wasm -maxdepth 3 \( -name 'clang*.wasm' -o -name 'lld*.wasm' \
            -o -name 'clang' -o -name 'lld' -o -name 'wasm-ld' \) -exec cp -v {} out/ \; || true
          # LLVM emits the wasm without extension when the exe name has none; tag them.
          for f in out/clang out/lld out/wasm-ld; do [ -f "$f" ] && mv "$f" "$f.wasm" || true; done
          # bundle the tiny wali sysroot so the browser can compile wali binaries
          # (checked in under wali/sysroot if present; otherwise document it).
          ls -la out
          for f in out/*.wasm; do echo "$(du -h "$f" | cut -f1)  $f"; done

      - name: Upload clang.wasm / lld.wasm
        uses: actions/upload-artifact@v4
        with:
          name: wasm-clang-${{ env.LLVM_VER }}
          path: /mnt/build/out/*.wasm
          if-no-files-found: error
          retention-days: 30
