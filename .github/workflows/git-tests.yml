# git's test suite helpers for walios (farm/ci/gittests/build.sh): builds git 2.45.3's
# t/helper programs with the WALI toolchain and publishes t/ + helpers as a release asset
# (git-tests-<ver>.tar.gz). A commit that changes farm/ci/gittests/request.json runs it (the
# token that pushes cannot dispatch workflows).
name: git-tests
on:
  push:
    branches: [main]
    paths: ['farm/ci/gittests/request.json', 'farm/ci/gittests/build.sh', '.github/workflows/git-tests.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: git-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  TC: ${{ github.workspace }}/../wali-tc
  TC_KEY: wali-tc-llvm22.1.3-pkgs-2026-10-31-x1-v43-ilp32

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with: { path: '${{ env.TC }}', key: '${{ env.TC_KEY }}' }
      - name: build test helpers
        run: bash farm/ci/gittests/build.sh "$TC" out
      - name: publish
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          tag=gittests-2.45.3-${{ github.run_number }}
          gh release create "$tag" out/git-tests-2.45.3.tar.gz out/git-core-2.45.3.tar.gz --prerelease --title "$tag" \
            --notes "git 2.45.3 test suite (t/ + WALI test helpers) for walios; built by farm/ci/gittests/build.sh"
