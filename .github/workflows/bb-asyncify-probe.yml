# Experiment (branch only, publishes nothing): build busybox with the normal recipe and keep
# the binary from BEFORE the Asyncify step, so Asyncify variants can be compared against it.
name: bb-asyncify-probe
on:
  push:
    branches: [claude/bb-asyncify-probe]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WALI_ABI: wali          # the live busybox.wasm is the 64-bit-long ABI (no wali.abi section)
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libbsd-dev libxml2 >/dev/null && bash farm/ci/toolchain.sh "$RUNNER_TEMP/tc"
      - name: Build busybox (recipe unchanged)
        run: WALI_TC="$RUNNER_TEMP/tc" bash runtimes/busybox/build.sh "$RUNNER_TEMP/out"
      - name: Logs on failure
        if: failure()
        run: for f in "$RUNNER_TEMP"/out/*.log; do [ -f "$f" ] && { echo "== $f"; tail -n 60 "$f"; }; done; true
      - name: Collect
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/out/busybox-1.36.1/busybox" dist/busybox.raw.wasm
          cp "$RUNNER_TEMP/out/busybox.wasm" dist/busybox.recipe.wasm
          cp "$RUNNER_TEMP/out/busybox.links" dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: bb-probe
          path: dist
