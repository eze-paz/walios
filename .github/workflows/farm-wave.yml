# One dependency wave of the farm (called by farm.yml): a matrix of jobs, each building a
# chunk of packages against the overlays of every earlier wave.
name: farm-wave
on:
  workflow_call:
    inputs:
      wave:   { type: number, required: true }
      chunks: { type: string, required: true }

env:
  TC: ${{ github.workspace }}/../wali-tc
  TC_KEY: wali-tc-llvm22.1.3-pkgs-2026-10-31-x1-v42-ilp32

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJSON(inputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: tc
        with: { path: '${{ env.TC }}', key: '${{ env.TC_KEY }}' }
      - if: steps.tc.outputs.cache-hit != 'true'
        run: bash farm/ci/toolchain.sh "$TC"
      # Python recipes build on Python 3.14, the version walios runs (same extension suffix);
      # first on PATH, so `python3`/`gpep517` in the recipes are this one.
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - uses: actions/cache/restore@v4
        with: { path: '~/aptc', key: "apt-${{ hashFiles('farm/ci/apt-tools.sh') }}-${{ github.run_id }}" }
      - name: Build tools
        run: |
          # Ubuntu's mirror once held a job 84 minutes in apt: short timeouts, retries, and
          # the whole install retried rather than waited on.
          A="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=300"
          # R41: a timeout that kills apt mid-install leaves dpkg locked and half-configured, and every
          # retry then fails on the lock. Before a retry: end what is left, finish dpkg's own work.
          # (|| true on each: the step runs under bash -e, and pkill finding nothing exits 1 -- R42 lost every job)
          unwedge() { sudo pkill -9 -x apt-get 2>/dev/null || true; sudo pkill -9 -x dpkg 2>/dev/null || true; sudo dpkg --configure -a >/dev/null 2>&1 || true; }
          # R40 lost 17 jobs to a stalled Azure mirror (3 x 600 s): the third try uses archive.ubuntu.com.
          mirror() { sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null; sudo timeout 300 apt-get $A update -qq; }
          . farm/ci/apt-tools.sh
          # The plan job's debs and package lists (farm.yml): no mirror involved.
          OFF="-o Dir::Cache::archives=$HOME/aptc/archives --no-download"
          if [ -d ~/aptc/lists ] && sudo cp -r ~/aptc/lists/. /var/lib/apt/lists/ &&
             sudo timeout 300 apt-get $A $OFF install -y -qq $APT_TOOLS >/dev/null; then
            echo "build tools installed from the plan job's debs"
            for p in $APT_OPTIONAL; do
              sudo timeout 120 apt-get $A $OFF install -y -qq --no-install-recommends "$p" >/dev/null 2>&1 || echo "optional build tool not installed: $p"; done
          else
            echo "no usable cached debs: installing from the mirror"
            for t in 1 2 3; do sudo timeout 300 apt-get $A update -qq && break; done
            for t in 1 2 3; do [ $t = 1 ] || unwedge; [ $t = 3 ] && mirror; sudo timeout 600 apt-get $A install -y -qq $APT_TOOLS >/dev/null && break; [ $t = 3 ] && exit 1; done
            for p in $APT_OPTIONAL; do
              sudo timeout 120 apt-get $A install -y -qq --no-install-recommends "$p" >/dev/null 2>&1 || { unwedge; echo "optional build tool not installed: $p"; }; done
          fi
          # Ubuntu's meson (1.3) is older than glib and friends require; pip's lands in
          # /usr/local/bin, ahead of /usr/bin on PATH.
          sudo pip3 install -q --break-system-packages --upgrade meson
          # Alpine's autoconf, automake, libtool and muon (the plan job built them into
          # ~/aptc/libtool; farm.yml): /usr/local/bin is ahead of /usr/bin, and build-one.sh puts
          # the macros first on ACLOCAL_PATH. samu (Alpine's ninja, which muon recipes call) is
          # the muon bootstrap's built-in samurai.
          # Debian's asciidoc and a2x run "python3 -m asciidoc": setup-python's python3 is first on
          # PATH and has no asciidoc module (git's docs failed in R49) -- the system python3 does.
          for f in /usr/bin/asciidoc /usr/bin/a2x; do [ -f "$f" ] && ! grep -q '/usr/bin/python3 -m' "$f" &&
            sudo sed -i -E '1s@^#!.*python3.*$@#!/usr/bin/python3@; s@(^|[^/])python3 -m@\1/usr/bin/python3 -m@' "$f"; done; true
          if [ -d ~/aptc/libtool/usr/local ]; then sudo cp -a ~/aptc/libtool/usr/local/. /usr/local/
            for t in autoconf automake libtoolize; do $t --version 2>/dev/null | head -1; done; muon version 2>/dev/null | head -1
            if [ -x /usr/local/libexec/muon-bootstrap ] && ! command -v samu >/dev/null; then
              printf '#!/bin/sh\nexec /usr/local/libexec/muon-bootstrap samu "$@"\n' | sudo tee /usr/local/bin/samu >/dev/null && sudo chmod +x /usr/local/bin/samu; fi
            # libtoolize 2.6.2's own trace of configure.ac (extract-trace, plain m4) comes back empty
            # here: "Remember to add 'LT_INIT'", aux files put in '.', and the tarball's older ltmain.sh
            # left in AC_CONFIG_AUX_DIR ("This is libtool 2.5.4, but ... LT_INIT comes from 2.6.2":
            # gnutls, libnl3; gpm: "cannot find required auxiliary files"). After it, what it copied
            # to '.' also goes where configure.ac's AC_CONFIG_AUX_DIR says (farm/ci/libtoolize-aux.sh).
            if [ -x /usr/local/bin/libtoolize ] && [ ! -e /usr/local/bin/libtoolize.real ]; then
              sudo mv /usr/local/bin/libtoolize /usr/local/bin/libtoolize.real
              sudo install -m 755 farm/ci/libtoolize-aux.sh /usr/local/bin/libtoolize; fi
          fi
          # Python recipes: gpep517 + installer (Alpine's wheel build/install), the common
          # PEP 517 backends and cython, in setup-python's 3.14 (sudo pip3 above is the system's).
          python3 -m pip install -q gpep517 installer build wheel setuptools setuptools-scm \
            flit-core hatchling hatch-vcs hatch-fancy-pypi-readme poetry-core pdm-backend cython pyyaml
          # ...whose pyconfig.h becomes walios python_cxx.wasm's (the toolchain's ABI: ILP32 by default):
          # C extensions then compile for walios (gcc = the wasm wrapper), with this Python's
          # suffix .cpython-314-x86_64-linux-gnu.so, the one walios Python imports.
          inc=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["include"])')
          cp "$TC/python/pyconfig.h" "$inc/pyconfig.h"
          python3 --version; gpep517 --help >/dev/null && echo gpep517 ok
          grep -q 'define SIZEOF_VOID_P 4' "$inc/pyconfig.h" && echo "pyconfig.h: walios"
          meson --version
          # wasm binaries run on the host through host/host.js (binfmt_misc): recipes that
          # build a helper with $CC and run it mid-build (libcap's _makenames, code
          # generators) used to die with "Exec format error".
          # With native-mode configure (farm/ci/config.site) every configure test program runs here too;
          # one that hangs (a blocking read, a busy wait) is ended after 2 minutes.
          printf '#!/bin/sh\nWALI_HOST_ENV=1 exec timeout -k 5 120 node %s "$@"\n' "$PWD/host/host.js" | sudo tee /usr/local/bin/wali-run >/dev/null
          sudo chmod +x /usr/local/bin/wali-run
          [ -e /proc/sys/fs/binfmt_misc/register ] || sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          echo ':wasm:M::\x00asm::/usr/local/bin/wali-run:' | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null || true
          ls /proc/sys/fs/binfmt_misc/ | tr '\n' ' '; echo
      - uses: actions/download-artifact@v4
        with: { name: aports, path: . }
      - name: Overlays from earlier waves
        if: inputs.wave > 0
        uses: actions/download-artifact@v4
        with: { pattern: 'ov-*', path: ov, merge-multiple: true }
      - name: Build
        run: |
          mkdir -p overlay out aports
          tar xzf aports.tar.gz -C aports
          export APORTS_DIR=$PWD/aports
          # Which archives each package contributed (build-one.sh links a package against its
          # own deps' archives only, from aports/deps.json).
          mkdir -p overlay-idx; export WALI_OVERLAY_IDX=$PWD/overlay-idx
          for t in ov/*.overlay.tar.gz; do [ -f "$t" ] || continue
            tar xzf "$t" -C overlay; tar tzf "$t" | grep '\.a$' > "overlay-idx/$(basename "$t" .overlay.tar.gz).list" || true; done
          # skalibs-based recipes (s6, execline, ...) hard-code /usr/lib/skalibs/sysdeps.
          [ -d overlay/usr/lib/skalibs ] && sudo ln -sfn "$PWD/overlay/usr/lib/skalibs" /usr/lib/skalibs || true
          source "$TC/env.sh"
          for p in ${{ matrix.chunk }}; do
            echo "::group::$p"
            # Own process group, killed whole after 10 min: `timeout bash ...` only signals bash,
            # which waits for its hung child (a test, a prompt) and so never ends.
            setsid bash farm/ci/build-one.sh "$p" overlay out > /dev/null < /dev/null & bp=$!
            ( sleep 600; kill -KILL -- -$bp 2>/dev/null ) & wp=$!
            wait $bp || true; kill $wp 2>/dev/null || true; wait $wp 2>/dev/null || true
            [ -f "out/$p.json" ] || echo "{\"pkg\":\"$p\",\"ver\":\"?\",\"status\":\"fail\",\"reason\":\"timeout\",\"secs\":600}" > "out/$p.json"
            cat "out/$p.json"
            echo "::endgroup::"
          done
      - name: Artifact name
        id: n
        run: echo "id=w${{ inputs.wave }}-$(echo '${{ matrix.chunk }}' | md5sum | cut -c1-10)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: 'res-${{ steps.n.outputs.id }}', path: 'out/*', if-no-files-found: ignore, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: 'ov-${{ steps.n.outputs.id }}', path: 'out/*.overlay.tar.gz', if-no-files-found: ignore, retention-days: 7 }
