<!doctype html>
<meta charset="utf-8">
<title>WALI browser host</title>
<style>
  body { font: 14px system-ui; margin: 16px; background: #111; color: #ddd; }
  button { margin: 0 6px 8px 0; padding: 6px 14px; font: inherit; }
  #term { background: #000; color: #cfc; font: 12px/1.35 monospace; padding: 10px;
          height: 60vh; overflow-y: auto; white-space: pre-wrap; border: 1px solid #333; }
  #term .err { color: #f99; }
  #status { margin: 8px 0; color: #9cf; }
  input { width: 60%; font: 12px monospace; padding: 4px; background:#222; color:#eee; border:1px solid #444; }
</style>
<h3>WALI wasm-OS — browser syscall host</h3>
<div>
  <button id="lua">lua test.lua</button>
  <button id="pyver">python -c version</button>
  <button id="bench">python GasN2 bench</button>
  <button id="bb">busybox ls /</button>
  <button id="bbsh">hush script</button>
  <button id="cc">compile in-browser (microcc)</button>
  <button id="wasi">run real wasi binary (clang-built)</button>
  <button id="realcc">compile C with REAL clang in-tab → run (wasi)</button>
  <button id="waliCC">compile C → WALI target in-tab → run as OS process</button>
</div>
<div id="status">idle — COI: <span id="coi"></span></div>
<div id="term"></div>
<form id="stdinForm"><input id="stdinLine" placeholder="stdin line (Enter sends)"><button>send</button></form>
<script>
const term = document.getElementById('term'), status = document.getElementById('status');
document.getElementById('coi').textContent = crossOriginIsolated;
function log(s, err) { const sp = document.createElement('span'); if (err) sp.className = 'err';
  sp.textContent = s; term.appendChild(sp); term.scrollTop = term.scrollHeight; }

let worker = null, running = false;
const sab = new SharedArrayBuffer(16 + 4096);
const ctl = new Int32Array(sab, 0, 4), data = new Uint8Array(sab, 16);

function freshWorker() {
  if (worker) worker.terminate();
  worker = new Worker('wali-worker.js');
  worker.postMessage({ t: 'stdin-sab', sab });
  worker.onmessage = (ev) => {
    const m = ev.data;
    if (m.t === 'out') log(m.s, m.fd === 2);
    else if (m.t === 'boot') status.textContent = `booted in ${m.ms.toFixed(0)}ms, running...`;
    else if (m.t === 'exit') { running = false;
      status.textContent = `exit=${m.code}  wall=${(m.ms/1000).toFixed(2)}s  syscalls=${m.syscalls}`;
      log(`\n[exit=${m.code} wall=${(m.ms/1000).toFixed(2)}s syscalls=${m.syscalls}]\n`, m.code !== 0); }
  };
}

function run(cfg) {
  if (running) { log('\n[already running]\n', true); return; }
  running = true; if (!cfg.keepTerm) term.textContent = ''; status.textContent = 'loading...';
  Atomics.store(ctl, 0, 0);
  freshWorker();
  const { keepTerm, ...msg } = cfg;
  worker.postMessage({ t: 'run', ...msg });
}

const PYENV = { PYTHONHOME: '/py', PYTHONPATH: '/py/Lib', PYTHONDONTWRITEBYTECODE: '1', HOME: '/', LC_ALL: 'C.UTF-8' };
const PYTARS = [['pylib.tar.gz', '/py'], ['bench.tar.gz', '/bench']];

document.getElementById('lua').onclick = () => run({
  wasm: 'lua.wasm', argv: ['lua', '/test.lua'], tars: [['luafile.tar.gz', '/']] });
document.getElementById('pyver').onclick = () => run({
  wasm: 'python.wasm', argv: ['python', '-c', 'import sys; print("WALI CPython in the browser:", sys.version); print("platform:", sys.platform); print(2**100)'],
  env: PYENV, tars: PYTARS });
document.getElementById('bench').onclick = () => run({
  wasm: 'python.wasm', argv: ['python', '/bench/time_baseline_wasi.py', '--data', '/bench/data', '--today', '2026-08-12', '--days', '2026-08-11'],
  env: PYENV, tars: PYTARS, opfs: '/files' });
document.getElementById('bb').onclick = () => run({
  wasm: 'busybox.wasm', argv: ['busybox', 'ls', '-la', '/'], tars: PYTARS, opfs: '/files' });
const MANIFEST = { 'busybox': 'busybox.wasm', 'sh': 'busybox.wasm', 'hush': 'busybox.wasm', 'python*': 'python.wasm', 'microcc': 'microcc.wasm' };
document.getElementById('bbsh').onclick = () => run({
  wasm: 'busybox.wasm', manifest: MANIFEST, env: PYENV, tars: PYTARS, opfs: '/files',
  argv: ['busybox', 'hush', '-c',
    'echo == external commands:; busybox uname -m; ' +
    'echo == pipeline: ; ls /bench/data | wc -l; ' +
    'echo == redirect:; echo persisted > /tmp2.txt; cat /tmp2.txt; ' +
    'echo == subshell pipe:; (echo S1; echo S2) | wc -l; ' +
    'echo == python in pipeline:; python -c "print(\'WALI \' * 3)" | wc -w; ' +
    'echo == all done'] });

document.getElementById('cc').onclick = () => run({
  wasm: 'busybox.wasm', manifest: MANIFEST,
  argv: ['busybox', 'hush', '-c',
    'echo 7*6-9 > /prog.src; ' +
    'echo [shell] compiling /prog.src with microcc, a wasm compiler running in this tab...; ' +
    'microcc /prog.src /prog.wasm; ' +
    'echo [shell] running the emitted wasm binary...; ' +
    '/prog.wasm; ' +
    'echo [shell] 7*6-9 = $? computed by freshly-compiled wasm, no native code'] });

document.getElementById('wasi').onclick = () => run({
  wasm: 'wt.wasm', manifest: MANIFEST, argv: ['wt', 'in-the-browser'] });

// REAL clang (LLVM 22, @yowasp/clang) compiling C in the tab, then our OS runs it.
let runClangFn = null;
document.getElementById('realcc').onclick = async () => {
  if (running) { log('\n[already running]\n', true); return; }
  term.textContent = ''; status.textContent = 'loading clang.wasm (73MB + 29MB resources, first time)...';
  try {
    if (!runClangFn) ({ runClang: runClangFn } = await import('./yowasp/gen/bundle.js'));
    const src = `#include <stdio.h>
int main(){
  printf("Hello from C, compiled by REAL clang running in this browser tab.\\n");
  long a=0,b=1; for(int i=0;i<30;i++){long t=a+b;a=b;b=t;}
  printf("fib(30)=%ld\\n", a);
  return 0;
}`;
    status.textContent = 'compiling prog.c with clang.wasm (LLVM 22) ...';
    let ccerr = '';
    const files = await runClangFn(['clang', '-O2', 'prog.c', '-o', 'prog.wasm'],
      { 'prog.c': src },
      { stderr: (bb) => { if (bb) ccerr += new TextDecoder().decode(bb); }, decodeASCII: true });
    if (!files['prog.wasm']) { log('clang failed:\n' + ccerr, true); status.textContent = 'clang failed'; return; }
    log(`[clang.wasm] compiled prog.wasm — ${files['prog.wasm'].length} bytes, in the tab\n`);
    log(`[os] running it on our WASI host:\n`);
    run({ vfsMain: '/prog.wasm', blobs: { '/prog.wasm': files['prog.wasm'] }, argv: ['prog'], keepTerm: true });
  } catch (e) { log('error: ' + (e.stack || e), true); status.textContent = 'error'; }
};

// fetch a .tar.gz and parse it into a YoWASP file Tree (nested object)
async function fetchTarTree(url) {
  const ds = new DecompressionStream('gzip');
  const buf = new Uint8Array(await new Response((await fetch(url)).body.pipeThrough(ds)).arrayBuffer());
  const root = {}; const td = new TextDecoder(); let off = 0;
  const put = (path, data) => { const parts = path.replace(/^\.\//, '').split('/').filter(Boolean);
    let cur = root; for (let i = 0; i < parts.length - 1; i++) cur = (cur[parts[i]] ||= {});
    cur[parts[parts.length - 1]] = data; };
  while (off + 512 <= buf.length) {
    const h = buf.subarray(off, off + 512); if (h.every(b => b === 0)) break;
    let name = td.decode(h.subarray(0, 100)).replace(/\0.*$/, '');
    const pfx = td.decode(h.subarray(345, 500)).replace(/\0.*$/, ''); if (pfx) name = pfx + '/' + name;
    const size = parseInt(td.decode(h.subarray(124, 136)).trim(), 8) || 0;
    const type = String.fromCharCode(h[156] || 48); off += 512;
    if ((type === '0' || type === '\0') && name) put(name, buf.slice(off, off + size));
    off += Math.ceil(size / 512) * 512;
  }
  return root;
}

// Compile C to a WALI binary in-tab (real clang), run as a native OS process.
let waliSysroot = null;
document.getElementById('waliCC').onclick = async () => {
  if (running) { log('\n[already running]\n', true); return; }
  term.textContent = ''; status.textContent = 'loading clang.wasm + wali sysroot...';
  try {
    if (!runClangFn) ({ runClang: runClangFn } = await import('./yowasp/gen/bundle.js'));
    if (!waliSysroot) waliSysroot = await fetchTarTree('./wali-sysroot.tar.gz');
    const src = `#include <stdio.h>
int main(){
  printf("Compiled to the WALI target by clang IN THE TAB; running as an OS process.\\n");
  long a=0,b=1; for(int i=0;i<32;i++){long t=a+b;a=b;b=t;}
  printf("fib(32)=%ld\\n", a);
  return 0;
}`;
    status.textContent = 'compiling prog.c -> wasm32-wali with clang.wasm ...';
    let ccerr = '';
    const args = ['clang', '--target=wasm32-unknown-linux-muslwali', '--sysroot=/sysroot',
      '-O2', '-mllvm', '-wasm-enable-sjlj', '-fwasm-exceptions', '-matomics', '-mbulk-memory',
      '-mexception-handling', '-L/sysroot/lib', '-nodefaultlibs',
      'prog.c', '-lc', '/sysroot/lib/libclang_rt.builtins.a', '-o', 'prog.wasm',
      '-Wl,--shared-memory,--export-memory,--max-memory=2147483648,-z,stack-size=8388608'];
    const files = await runClangFn(args, { sysroot: waliSysroot, 'prog.c': src },
      { stderr: (bb) => { if (bb) ccerr += new TextDecoder().decode(bb); }, decodeASCII: true });
    if (!files['prog.wasm']) { log('clang failed:\n' + ccerr, true); status.textContent = 'clang failed'; return; }
    const mod = await WebAssembly.compile(files['prog.wasm']);
    const imp = [...new Set(WebAssembly.Module.imports(mod).map(i => i.module))].join(',');
    log(`[clang.wasm] compiled a WALI binary — ${files['prog.wasm'].length} bytes, imports: ${imp}\n`);
    log(`[os] running it as a native WALI process:\n`);
    run({ vfsMain: '/prog.wasm', blobs: { '/prog.wasm': files['prog.wasm'] }, argv: ['prog'], keepTerm: true });
  } catch (e) { log('error: ' + (e.stack || e), true); status.textContent = 'error'; }
};

document.getElementById('stdinForm').onsubmit = (e) => {
  e.preventDefault();
  const v = document.getElementById('stdinLine').value + '\n';
  document.getElementById('stdinLine').value = '';
  const bytes = new TextEncoder().encode(v);
  data.set(bytes.subarray(0, 4000), 0);
  Atomics.store(ctl, 1, Math.min(bytes.length, 4000));
  Atomics.store(ctl, 0, 1);
  Atomics.notify(ctl, 0);
};
</script>
