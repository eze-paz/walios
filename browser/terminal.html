<!doctype html>
<meta charset="utf-8">
<title>walios — terminal</title>
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; }
  #term { position: fixed; inset: 0; padding: 6px; }
</style>
<div id="term"></div>
<script src="xterm.js"></script>
<script src="xterm-addon-fit.js"></script>
<script>
const term = new Terminal({ cursorBlink: true, fontSize: 14, fontFamily: 'Menlo, Consolas, monospace',
  theme: { background: '#0b0d10', foreground: '#cfe3cf' }, scrollback: 5000 });
const fit = new FitAddon.FitAddon(); term.loadAddon(fit);
term.open(document.getElementById('term')); fit.fit(); term.focus();

let worker = null, running = false;
const MANIFEST = { busybox: 'busybox.wasm', sh: 'busybox.wasm', hush: 'busybox.wasm', python: 'python.wasm', 'python3': 'python.wasm', lua: 'lua.wasm' };

// Persistent home via OPFS, isolated to a "walios-home" subdir so the shell can't
// touch the host app's OPFS data. A sibling worker owns the OPFS handles (SAB bridge).
const opfsSab = new SharedArrayBuffer(32 + (1 << 20));
const opfsWorker = new Worker('opfs-worker.js');
opfsWorker.postMessage({ t: 'sab', sab: opfsSab, subdir: 'walios-home' });

function boot() {
  running = true;
  worker = new Worker('wali-worker.js');
  worker.postMessage({ t: 'opfs-sab', sab: opfsSab });
  worker.onmessage = (ev) => {
    const m = ev.data;
    if (m.t === 'out') { if (m.fd === 2 && /^\[host\]/.test(m.s)) { console.debug(m.s.trim()); return; } term.write(m.s); }
    else if (m.t === 'exit') { running = false; term.write('\r\n\x1b[90m[shell exited (' + m.code + ') — reloading…]\x1b[0m\r\n'); setTimeout(() => location.reload(), 900); }
  };
  worker.postMessage({ t: 'run', wasm: 'busybox.wasm', manifest: MANIFEST,
    tars: [['rootfs.tar.gz', '/']], opfs: '/root',   // /root is a persistent OPFS home
    env: { HOME: '/root', TERM: 'xterm', PATH: '/bin:/usr/bin', PS1: 'walios:$PWD$ ', HOSTNAME: 'walios' },
    cwd: '/root', argv: ['busybox', 'ash', '-i'], jspi: true, pty: true,
    cols: term.cols, rows: term.rows });
}
term.onData(d => { if (worker && running) worker.postMessage({ t: 'stdin', data: d }); });
window.addEventListener('resize', () => { try { fit.fit(); if (worker && running) worker.postMessage({ t: 'winsize', cols: term.cols, rows: term.rows }); } catch {} });
term.write('\x1b[90mwalios — starting a shell (busybox on a pty, native wasm)…\x1b[0m\r\n');
boot();
</script>
